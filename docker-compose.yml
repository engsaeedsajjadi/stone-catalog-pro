services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: stone_catalog
      POSTGRES_USER: stone
      POSTGRES_PASSWORD: stone
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stone -d stone_catalog"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  migrate:
    build:
      context: .
      target: worker
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://stone:stone@db:5432/stone_catalog?schema=public

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://stone:stone@db:5432/stone_catalog?schema=public
      REDIS_URL: redis://redis:6379
      # در فایل .env کنار همین فایل مقداردهی شود
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET را در فایل .env تنظیم کنید}

  app:
    build: .
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://stone:stone@db:5432/stone_catalog?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      # در فایل .env کنار همین فایل مقداردهی شود
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET را در فایل .env تنظیم کنید}
      STORAGE_PROVIDER: local
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /app/storage/uploads
    volumes:
      - app_uploads:/app/storage/uploads

volumes:
  postgres_data:
  app_uploads:
  redis_data:
