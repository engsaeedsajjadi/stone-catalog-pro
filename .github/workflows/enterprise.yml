name: enterprise
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stone
          POSTGRES_PASSWORD: stone
          POSTGRES_DB: stone_catalog
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stone -d stone_catalog" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - run: npx prisma db push
        env:
          DATABASE_URL: postgresql://stone:stone@localhost:5432/stone_catalog?schema=public
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
  docker:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: stone-catalog:ci
