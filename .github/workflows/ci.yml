name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: stone_catalog
          POSTGRES_USER: stone
          POSTGRES_PASSWORD: stone
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stone -d stone_catalog"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run build
        env:
          DATABASE_URL: postgresql://stone:stone@localhost:5432/stone_catalog?schema=public
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          APP_URL: http://localhost:3000
          JWT_SECRET: test-secret-test-secret-test-secret-123456
